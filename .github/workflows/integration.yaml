name: Integration tests

# On-device tests from example/integration_test. They need a simulator, so
# they run on macOS, off the pull request path: after each merge to main,
# nightly, and on demand (Actions > Integration tests > Run workflow).

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-simulator:
    name: Test · Integration (iOS simulator)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter
        with:
          working-directory: example
      - name: Boot iPhone simulator
        id: simulator
        run: |
          udid=$(xcrun simctl list devices available --json \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          if [ -z "$udid" ] || [ "$udid" = null ]; then
            echo "No iPhone simulator available" >&2
            exit 1
          fi
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      # The simulator on hosted runners sometimes hangs after "Xcode build
      # done." (the app never connects) or fails on timing. The script runs
      # one test file at a time, and retries a file on a rebooted simulator
      # when it fails or prints nothing for 5 minutes. A clean run takes about
      # 10 minutes; the step timeout is a backstop for the script itself.
      - name: Run integration tests
        timeout-minutes: 45
        working-directory: example
        env:
          DEVICE_ID: ${{ steps.simulator.outputs.udid }}
        run: ../.github/scripts/run-integration-tests.sh

  # Nobody watches scheduled runs, so a nightly failure opens (or comments on)
  # an issue.
  report-nightly-failure:
    name: Report nightly failure
    needs: ios-simulator
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='Nightly integration tests are failing'
          body="The scheduled integration test run failed: $RUN_URL"
          number=$(gh issue list --state open --search "\"$title\" in:title" \
            --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
