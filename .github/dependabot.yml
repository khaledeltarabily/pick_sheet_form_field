# Keeps the SHA-pinned actions and the dev dependencies up to date. Commit
# prefixes follow Conventional Commits so the PR title check passes.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: pub
    directories:
      - /
      - /example
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      dart-dependencies:
        patterns: ['*']
